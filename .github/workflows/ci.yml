name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      # uv installs any CPython (actions/setup-python has no 3.9 for the current ubuntu-latest)
      - uses: astral-sh/setup-uv@v6
      - name: bubblewrap for the agent sandbox test
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv venv -p ${{ matrix.python-version }} && uv pip install -e ".[test]"
      - run: .venv/bin/python -m pytest -q
